name: driftah
description: Diff two OCI images, UKIs, or disk images (rpm, apk, or deb) and produce package + file release notes.

inputs:
  from:
    description: Old image reference, UKI (.efi), or disk image (.img).
    required: true
  to:
    description: New image reference, UKI (.efi), or disk image (.img).
    required: true
  image:
    description: driftah container image to run (pin to a digest for a trusted supply chain).
    required: false
    default: ghcr.io/lewis-qs/driftah:latest
  args:
    description: Extra driftah flags, e.g. "--paths etc/,usr/lib --ignore-packages kernel".
    required: false
    default: ""

outputs:
  notes:
    description: The generated markdown release notes.
    value: ${{ steps.run.outputs.notes }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        DRIFTAH_IMAGE: ${{ inputs.image }}
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        ARGS: ${{ inputs.args }}
      run: "$GITHUB_ACTION_PATH/driftah-run.sh"
