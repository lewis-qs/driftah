name: driftah
description: Diff two OCI images and produce package + file release notes.

inputs:
  from:
    description: Old image reference.
    required: true
  to:
    description: New image reference.
    required: true
  image:
    description: driftah container image to run (pin to a digest for a trusted supply chain).
    required: false
    default: ghcr.io/lewis-qs/driftah:latest
  args:
    description: Extra driftah flags, e.g. "--paths etc/,usr/lib --ignore-packages kernel".
    required: false
    default: ""

outputs:
  notes:
    description: The generated markdown release notes.
    value: ${{ steps.run.outputs.notes }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        DRIFTAH_IMAGE: ${{ inputs.image }}
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        auth=""
        if [ -n "${REGISTRY_AUTH_FILE:-}" ] && [ -f "${REGISTRY_AUTH_FILE}" ]; then
          auth="${REGISTRY_AUTH_FILE}"
        elif [ -n "${XDG_RUNTIME_DIR:-}" ] && [ -f "${XDG_RUNTIME_DIR}/containers/auth.json" ]; then
          auth="${XDG_RUNTIME_DIR}/containers/auth.json"
        fi
        mount=()
        [ -n "$auth" ] && mount=(-v "$auth:/tmp/auth.json:ro" -e REGISTRY_AUTH_FILE=/tmp/auth.json)
        notes="$(podman run --rm "${mount[@]}" "$DRIFTAH_IMAGE" $ARGS "$FROM" "$TO")"
        delim="driftah_$(head -c16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        case "$notes" in *"$delim"*) echo "::error::notes delimiter collision"; exit 1;; esac
        {
          echo "notes<<$delim"
          printf '%s\n' "$notes"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"
